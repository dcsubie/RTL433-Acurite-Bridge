name: RTL433 Acurite Bridge
version: "0.1.15"
slug: rtl433_acurite_bridge
description: Acurite-first rtl_433 MQTT Discovery bridge for Home Assistant (other brands via protocols).
url: https://github.com/dcsubie/RTL433-Acurite-Bridge

arch:
  - amd64
  - aarch64
  - armv7

startup: application
boot: auto

init: false
host_network: true
usb: true
uart: true

services:
  - mqtt:want

options:
  mqtt_host: core-mosquitto
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_topic: rtl_433
  whitelist: []
  protocols: [11, 40, 41, 55, 74]
  units: si
  frequency: "433.92M"
  gain: ""
  ppm: 0

schema:
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  mqtt_topic: str
  # Trailing ? makes the whole list optional so HA can save an empty /
  # omitted whitelist (accept all IDs) and an empty protocols list (all
  # rtl_433 decoders).
  whitelist:
    - int?
  protocols:
    - int?
  units: list(si|custom)
  frequency: str
  gain: str?
  ppm: int(-1000,1000)
