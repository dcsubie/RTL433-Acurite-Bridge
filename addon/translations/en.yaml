configuration:
  mqtt_host:
    name: MQTT host
    description: Broker hostname. Leave as core-mosquitto for the official Mosquitto add-on.
  mqtt_port:
    name: MQTT port
    description: Broker port (usually 1883).
  mqtt_username:
    name: MQTT username
    description: Leave blank to use Supervisor MQTT credentials with the default broker host.
  mqtt_password:
    name: MQTT password
    description: Broker password. Leave blank when using Supervisor auto-configuration.
  mqtt_topic:
    name: MQTT topic root
    description: Root topic for sensor state payloads (default rtl_433).
  whitelist:
    name: Sensor whitelist
    description: Optional rtl_433 sensor IDs to keep. Empty accepts all decoded IDs; set this after first run to ignore neighbors.
  protocols:
    name: rtl_433 protocols
    description: >-
      Protocol numbers passed to rtl_433 with -R. Defaults are Acurite-first
      (11=609TXC, 40=5n1/3n1/Atlas/592TXR, 41=986, 55=606TX, 74=00275/00276).
      Empty enables every rtl_433 decoder.
  units:
    name: Units
    description: Keep si for the current bridge field mapping (recommended). custom is advanced and may not populate entities yet.
  frequency:
    name: Frequency
    description: >-
      rtl_433 tuner frequency (-f). Default 433.92M for US Acurite. Try
      433.9M or 434.0M if the display works but the SDR never hears the 5n1.
  gain:
    name: Tuner gain
    description: >-
      rtl_433 gain (-g). Default 40. Try auto, 20, 30, or 49.6 if needed.
      Leave blank to use the rtl_433 default.
  ppm:
    name: Frequency correction (ppm)
    description: >-
      Optional crystal correction (-p). Try 20, -20, 40, or -40 if nearby
      sensors decode but the 5n1 does not.
  classic_demod:
    name: Classic demodulator
    description: >-
      Enable rtl_433 -Y classic (default on in 0.1.19). Newer rtl_433 builds
      changed demod defaults; classic matches older receive behavior.
